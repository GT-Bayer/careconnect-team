<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - Nuestro Equipo</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for clean brand and UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        careTeal: {
                            DEFAULT: '#00838f',
                            dark: '#006978',
                            light: '#e0f2f1',
                            hover: '#00707a'
                        },
                        careSky: {
                            DEFAULT: '#9bcbe6',
                            light: '#e8f4f9',
                            accent: '#64b5f6'
                        },
                        careDark: '#0f172a',
                        careGray: '#475569'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .member-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .member-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px -6px rgba(0, 131, 143, 0.12), 0 8px 12px -6px rgba(0, 0, 0, 0.04);
            border-color: #9bcbe6;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-careTeal selection:text-white">

    <!-- Header with official brand logo style -->
    <header class="w-full border-b border-slate-200/80 bg-white/90 backdrop-blur-md sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between">
            <!-- Brand Logo identical to the platform -->
            <a href="#" class="flex items-center gap-3 group">
                <!-- SVG Vector EXACT reproduction of logo_careconnect-CHE5-UrG.png -->
                <svg class="h-10 w-auto drop-shadow-sm transition-transform duration-200 group-hover:scale-105"
                    viewBox="0 0 1000 680" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Dark Teal / Petrol Blue Main 'C' Shape (#017c96) -->
                    <path
                        d="M 546 186 C 532 186 520 174 520 160 C 520 104 466 50 300 50 C 134 50 50 178 50 340 C 50 502 134 630 300 630 C 466 630 540 560 575 460 C 585 432 560 404 530 404 C 500 404 478 424 455 460 C 418 514 365 528 300 528 C 196 528 152 444 152 340 C 152 236 196 152 300 152 C 370 152 428 174 464 230 C 478 252 505 264 532 248 C 543 241 550 228 550 215 C 550 200 550 186 546 186 Z"
                        fill="#017c96" />

                    <!-- Soft Pastel Cyan Outer Ring / 'o' Shape (#9ec8da) -->
                    <path
                        d="M 686 168 C 825 168 938 281 938 420 C 938 559 825 672 686 672 C 588 672 522 626 512 590 C 504 562 525 536 554 536 C 576 536 594 547 612 560 C 634 576 659 584 686 584 C 777 584 850 511 850 420 C 850 329 777 256 686 256 C 616 256 558 300 536 362 C 528 386 504 402 478 392 C 452 382 440 354 448 328 C 484 220 576 168 686 168 Z"
                        fill="#9ec8da" />

                    <!-- Center Solid Dot in Pastel Cyan (#9ec8da) -->
                    <circle cx="686" cy="420" r="60" fill="#9ec8da" />
                </svg>
                <span class="text-2xl font-extrabold tracking-tight text-slate-800">
                    Care<span class="text-careTeal">Connect</span>
                </span>
            </a>

            <!-- Subtitle badge in navbar -->
            <span
                class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1 text-xs font-semibold text-careTeal bg-careTeal-light rounded-full border border-careTeal/20">
                <i class="fa-solid fa-users text-[11px]"></i> Equipo de Desarrollo
            </span>
        </div>
    </header>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 py-8 sm:py-12">
        <!-- Hero / Presentation Close -->
        <div class="text-center max-w-2xl mx-auto mb-8 sm:mb-12">
            <div
                class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-teal-50 border border-teal-200/80 text-careTeal text-xs font-semibold mb-3 shadow-xs">
                <i class="fa-solid fa-heart-pulse text-xs text-careTeal"></i>
                <span>Presentación Final</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                Equipo <span class="text-careTeal">CareConnect</span>
            </h1>
            <p class="mt-2.5 text-slate-600 text-sm sm:text-base leading-relaxed">
                Conectamos familias con profesionales de confianza para brindar el cuidado que cada persona necesita.
            </p>
        </div>

        <div id="teamGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
            <!-- Member cards injected dynamically -->
        </div>
    </main>

    <footer class="w-full border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500">
        <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p>© 2026 CareConnect · Cuidado y compañía cuando más lo necesitás.</p>
            <div class="flex items-center gap-2 text-slate-400">
                <svg class="h-5 w-auto inline" viewBox="0 0 1000 680" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M 546 186 C 532 186 520 174 520 160 C 520 104 466 50 300 50 C 134 50 50 178 50 340 C 50 502 134 630 300 630 C 466 630 540 560 575 460 C 585 432 560 404 530 404 C 500 404 478 424 455 460 C 418 514 365 528 300 528 C 196 528 152 444 152 340 C 152 236 196 152 300 152 C 370 152 428 174 464 230 C 478 252 505 264 532 248 C 543 241 550 228 550 215 C 550 200 550 186 546 186 Z"
                        fill="#017c96" />
                    <path
                        d="M 686 168 C 825 168 938 281 938 420 C 938 559 825 672 686 672 C 588 672 522 626 512 590 C 504 562 525 536 554 536 C 576 536 594 547 612 560 C 634 576 659 584 686 584 C 777 584 850 511 850 420 C 850 329 777 256 686 256 C 616 256 558 300 536 362 C 528 386 504 402 478 392 C 452 382 440 354 448 328 C 484 220 576 168 686 168 Z"
                        fill="#9ec8da" />
                    <circle cx="686" cy="420" r="60" fill="#9ec8da" />
                </svg>
                <span>CareConnect HealthTech</span>
            </div>
        </div>
    </footer>

    <script>
        const teamMembers = [
            {
                name: "Gabriel Bayer",
                role: "Tech Lead · Backend & DB Developer",
                roleBadge: "bg-teal-50 text-teal-800 border-teal-200",
                linkedin: "https://www.linkedin.com/in/gtbayer/",
                avatarBg: "bg-gradient-to-tr from-cyan-800 to-teal-600 text-white",
                initials: "GB"
            },
            {
                name: "Agustin Nuñez",
                role: "Project Manager",
                roleBadge: "bg-sky-50 text-sky-800 border-sky-200",
                linkedin: "https://www.linkedin.com/in/agust%C3%ADn-nu%C3%B1ez-7a7121294/",
                avatarBg: "bg-gradient-to-tr from-slate-700 to-cyan-800 text-white",
                initials: "AN"
            },
            {
                name: "Anahi Rodriguez",
                role: "Desarrollador Front end",
                roleBadge: "bg-cyan-50 text-cyan-800 border-cyan-200",
                linkedin: "https://www.linkedin.com/in/anahi-belen-rodriguez/",
                avatarBg: "bg-gradient-to-tr from-teal-600 to-sky-400 text-white",
                initials: "AR"
            },
            {
                name: "Agostina Ledesma",
                role: "Desarrollador Fullstack",
                roleBadge: "bg-emerald-50 text-emerald-800 border-emerald-200",
                linkedin: "https://www.linkedin.com/in/agustinaledesmaa/",
                avatarBg: "bg-gradient-to-tr from-teal-700 to-teal-500 text-white",
                initials: "AL"
            },
            {
                name: "Daniela Fernandez",
                role: "Desarrollador Fullstack",
                roleBadge: "bg-emerald-50 text-emerald-800 border-emerald-200",
                linkedin: "https://www.linkedin.com/in/danielafernandezlaura/",
                avatarBg: "bg-gradient-to-tr from-teal-600 to-cyan-500 text-white",
                initials: "DF"
            },
            {
                name: "Leonardo Haron",
                role: "Desarrollador Back end / DB",
                roleBadge: "bg-slate-100 text-slate-800 border-slate-300",
                linkedin: "https://www.linkedin.com/in/leonardo-haron-784017126/",
                avatarBg: "bg-gradient-to-tr from-slate-800 to-teal-800 text-white",
                initials: "LH"
            },
            {
                name: "Sasha Pallares",
                role: "Desarrollador Front end",
                roleBadge: "bg-cyan-50 text-cyan-800 border-cyan-200",
                linkedin: "https://www.linkedin.com/in/sashapallares/",
                avatarBg: "bg-gradient-to-tr from-cyan-600 to-sky-400 text-white",
                initials: "SP"
            }
        ];

        function renderTeam(members = teamMembers) {
            const container = document.getElementById('teamGrid');

            container.innerHTML = members.map(member => `
        <a 
          href="${member.linkedin}" 
          target="_blank" 
          rel="noopener noreferrer"
          class="member-card group block p-4 sm:p-5 rounded-2xl bg-white border border-slate-200/90 shadow-sm relative overflow-hidden"
          title="Ver perfil de ${member.name} en LinkedIn"
        >
          <div class="flex items-center gap-3.5">
            <!-- Avatar with styled initials -->
            <div class="w-12 h-12 shrink-0 rounded-full ${member.avatarBg} flex items-center justify-center font-bold text-base shadow-sm ring-2 ring-slate-100 group-hover:scale-105 transition-transform duration-200">
              ${member.initials}
            </div>

            <!-- Member details -->
            <div class="flex-grow min-w-0">
              <div class="flex items-center justify-between gap-1">
                <h3 class="text-base font-bold text-slate-800 group-hover:text-careTeal transition-colors truncate">
                  ${member.name}
                </h3>
                <i class="fa-brands fa-linkedin text-[#0a66c2] text-xl opacity-90 group-hover:opacity-100 group-hover:scale-110 transition-transform shrink-0"></i>
              </div>

              <!-- Role Tag -->
              <div class="mt-1">
                <span class="inline-block text-[11px] font-semibold px-2.5 py-0.5 rounded-md border ${member.roleBadge}">
                  ${member.role}
                </span>
              </div>
            </div>
          </div>

          <!-- Card bottom action bar -->
          <div class="mt-3.5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 group-hover:text-careTeal font-medium">
            <span class="flex items-center gap-1.5">
              <span>Conectar en LinkedIn</span>
            </span>
            <span class="group-hover:translate-x-1 transition-transform">
              <i class="fa-solid fa-arrow-right text-[11px]"></i>
            </span>
          </div>
        </a>
      `).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderTeam();
        });
    </script>
</body>

</html>
